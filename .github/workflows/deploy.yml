name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual deploy reason'
        required: false
        default: 'manual-trigger'

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.repository }}-websitegenerator-roadrunner-towing
  cancel-in-progress: true

env:
  REGISTRY_NAME: websitegenerator
  IMAGE_NAME: roadrunner-towing

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Wait for any active Container App operation to finish
        run: |
          set -e
          APP_NAME="roadrunner-towing"
          RG_NAME="website-generator"
          echo "Checking provisioning state for $APP_NAME in $RG_NAME..."
          for i in {1..30}; do
            state=$(az containerapp show -n "$APP_NAME" -g "$RG_NAME" --query 'properties.provisioningState' -o tsv 2>/dev/null || echo "NotFound")
            if [ "$state" = "NotFound" ] || [ -z "$state" ] || [ "$state" = "Succeeded" ] || [ "$state" = "Failed" ] || [ "$state" = "Canceled" ]; then
              echo "Provisioning state: $state. Proceeding."
              break
            fi
            echo "Provisioning state: $state. Waiting... ($i/30)"
            sleep 20
          done

      - name: Build and deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: ${{ env.REGISTRY_NAME }}
          containerAppName: roadrunner-towing
          resourceGroup: website-generator
          containerAppEnvironment: hosted-websites-prod
          imageToBuild: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          acrUsername: ${{ secrets.REGISTRY_USERNAME }}
          acrPassword: ${{ secrets.REGISTRY_PASSWORD }}
          ingress: external
          targetPort: 3000

      - name: Get Container Apps Environment Default Domain
        id: get-domain
        run: |
          set -e
          ENV_NAME="hosted-websites-prod"
          RG_NAME="website-generator"
          DEFAULT_DOMAIN=$(az containerapp env show -n "$ENV_NAME" -g "$RG_NAME" --query properties.defaultDomain -o tsv)
          echo "default_domain=$DEFAULT_DOMAIN" >> $GITHUB_OUTPUT

      - name: App URL
        run: echo "https://roadrunner-towing.${{ steps.get-domain.outputs.default_domain }}"